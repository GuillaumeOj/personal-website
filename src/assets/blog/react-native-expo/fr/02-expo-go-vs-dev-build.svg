<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Expo Go vs Dev Build</title>
<desc>Schéma comparant le flux Expo Go, qui charge un bundle JavaScript sur une application générique via le réseau local, et le flux Dev Build, qui compile les dépendances natives dans une app buildée dédiée.</desc>
<rect width="800" height="340" fill="#faf8f4"/>
<line x1="400" y1="30" x2="400" y2="300" stroke="#e7e2d9" stroke-width="2"/>
<text x="200" y="45" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#1c1917">Expo Go</text>
<rect x="70" y="80" width="130" height="50" rx="8" fill="#ffffff" stroke="#e7e2d9" stroke-width="1.5"/>
<text x="135" y="110" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#292524">Bundle JS</text>
<path d="M200 105 L250 105" stroke="#78716c" stroke-width="1.5" marker-end="url(#a1)"/>
<text x="225" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#78716c">wifi</text>
<rect x="255" y="80" width="140" height="50" rx="8" fill="#f3efe8" stroke="#e7e2d9" stroke-width="1.5"/>
<text x="325" y="102" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#292524">App Expo Go</text>
<text x="325" y="117" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#78716c">générique</text>
<rect x="140" y="170" width="120" height="90" rx="12" fill="#ffffff" stroke="#e7e2d9" stroke-width="1.5"/>
<circle cx="200" cy="255" r="4" fill="#e7e2d9"/>
<text x="200" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" fill="#ea7317">⟳</text>
<text x="200" y="225" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#78716c">refresh en</text>
<text x="200" y="238" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#78716c">quelques secondes</text>
<text x="200" y="290" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#78716c">Pas de modules natifs custom</text>
<text x="600" y="45" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#1c1917">Dev Build</text>
<rect x="460" y="80" width="130" height="50" rx="8" fill="#fdf1e6" stroke="#ea7317" stroke-width="1.5"/>
<text x="525" y="102" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#b45309">Code + modules</text>
<text x="525" y="116" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#b45309">natifs</text>
<path d="M590 105 L640 105" stroke="#ea7317" stroke-width="1.5" marker-end="url(#a2)"/>
<text x="615" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#b45309">EAS Build</text>
<rect x="645" y="80" width="130" height="50" rx="8" fill="#f3efe8" stroke="#e7e2d9" stroke-width="1.5"/>
<text x="710" y="102" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#292524">App buildée</text>
<text x="710" y="117" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#78716c">sur mesure</text>
<rect x="540" y="170" width="120" height="90" rx="12" fill="#ffffff" stroke="#e7e2d9" stroke-width="1.5"/>
<circle cx="600" cy="255" r="4" fill="#e7e2d9"/>
<text x="600" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" fill="#ea7317">⟳</text>
<text x="600" y="225" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#78716c">même confort,</text>
<text x="600" y="238" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#78716c">sans les limites</text>
<text x="600" y="290" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#78716c">Toutes les dépendances natives incluses</text>
<defs>
<marker id="a1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#78716c"/></marker>
<marker id="a2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ea7317"/></marker>
</defs>
</svg>
