<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>EAS Build pipeline: Development, Preview, Production</title>
<desc>Diagram of the EAS Build pipeline with three profiles: Development for local development, Preview for internal testers, and Production for store submission.</desc>
<rect width="800" height="260" fill="#faf8f4"/>
<text x="400" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#1c1917">eas.json — build profiles</text>
<rect x="60" y="80" width="200" height="110" rx="12" fill="#ffffff" stroke="#e7e2d9" stroke-width="1.5"/>
<text x="160" y="108" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#292524">Development</text>
<text x="160" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#78716c">Debug modules</text>
<text x="160" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#78716c">Local server</text>
<text x="160" y="172" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" fill="#78716c">💻</text>
<path d="M262 135 L318 135" stroke="#78716c" stroke-width="1.5" marker-end="url(#b1)"/>
<rect x="322" y="80" width="200" height="110" rx="12" fill="#fdf1e6" stroke="#ea7317" stroke-width="1.5"/>
<text x="422" y="108" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#b45309">Preview</text>
<text x="422" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#b45309">Close to production</text>
<text x="422" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#b45309">Direct link, testers</text>
<text x="422" y="172" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" fill="#b45309">🧪</text>
<path d="M524 135 L580 135" stroke="#78716c" stroke-width="1.5" marker-end="url(#b1)"/>
<rect x="584" y="80" width="200" height="110" rx="12" fill="#ffffff" stroke="#e7e2d9" stroke-width="1.5"/>
<text x="684" y="108" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#292524">Production</text>
<text x="684" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#78716c">Optimized, signed</text>
<text x="684" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#78716c">App Store / Play Console</text>
<text x="684" y="172" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" fill="#78716c">🚀</text>
<text x="400" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#78716c">Reproducible for anyone on the project</text>
<defs>
<marker id="b1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#78716c"/></marker>
</defs>
</svg>
