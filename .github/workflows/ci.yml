name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# Two parallel jobs: the fast static checks, and the build + browser tests.
jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup (LFS, Node, Bun, dependencies)
        uses: ./.github/actions/setup

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck (astro check)
        run: bun run typecheck

      - name: Unit tests (Vitest)
        run: bun run test:unit

  build-e2e:
    name: Build, E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup (LFS, Node, Bun, dependencies)
        uses: ./.github/actions/setup

      # Astro keeps optimized images in node_modules/.astro/assets: reuse them
      # while the source images are unchanged. Only that folder: the content
      # data store next to it is rebuilt from the checked-out sources.
      - name: Cache Astro images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro/assets
          key: astro-${{ runner.os }}-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-${{ runner.os }}-

      - name: Build (Astro)
        run: bun run build

      # Keyed on the Playwright version only, so unrelated lockfile updates
      # keep the downloaded browsers.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: E2E tests (Playwright)
        run: bun run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
