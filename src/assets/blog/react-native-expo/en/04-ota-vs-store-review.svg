<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>OTA Update vs store review: comparing turnaround times</title>
<desc>Timeline comparing the time it takes to ship a fix via an OTA update (a few minutes) versus a classic store submission with Apple review (24 to 48 hours).</desc>
<rect width="800" height="300" fill="#faf8f4"/>
<text x="400" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#1c1917">Fixing a bug in production</text>
<text x="60" y="85" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">EAS Update (OTA)</text>
<rect x="60" y="95" width="80" height="36" rx="6" fill="#ffffff" stroke="#e7e2d9" stroke-width="1.5"/>
<text x="100" y="117" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#292524">Bug found</text>
<path d="M140 113 L200 113" stroke="#ea7317" stroke-width="2" marker-end="url(#c1)"/>
<rect x="204" y="95" width="80" height="36" rx="6" fill="#fdf1e6" stroke="#ea7317" stroke-width="1.5"/>
<text x="244" y="117" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#b45309">Fix + publish</text>
<path d="M284 113 L344 113" stroke="#ea7317" stroke-width="2" marker-end="url(#c1)"/>
<rect x="348" y="95" width="120" height="36" rx="6" fill="#fdf1e6" stroke="#ea7317" stroke-width="1.5"/>
<text x="408" y="117" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#b45309">Live (~min)</text>
<text x="60" y="180" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#292524">Store submission</text>
<rect x="60" y="190" width="80" height="36" rx="6" fill="#ffffff" stroke="#e7e2d9" stroke-width="1.5"/>
<text x="100" y="212" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#292524">Bug found</text>
<path d="M140 208 L200 208" stroke="#78716c" stroke-width="2" marker-end="url(#c2)"/>
<rect x="204" y="190" width="80" height="36" rx="6" fill="#f3efe8" stroke="#e7e2d9" stroke-width="1.5"/>
<text x="244" y="212" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#292524">Submit</text>
<path d="M284 208 L470 208" stroke="#78716c" stroke-width="2" marker-end="url(#c2)"/>
<rect x="474" y="190" width="130" height="36" rx="6" fill="#f3efe8" stroke="#e7e2d9" stroke-width="1.5"/>
<text x="539" y="212" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#292524">Apple review</text>
<path d="M604 208 L664 208" stroke="#78716c" stroke-width="2" marker-end="url(#c2)"/>
<rect x="668" y="190" width="110" height="36" rx="6" fill="#f3efe8" stroke="#e7e2d9" stroke-width="1.5"/>
<text x="723" y="212" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#292524">24-48h</text>
<text x="400" y="270" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#78716c">JS only — no native code via OTA</text>
<defs>
<marker id="c1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ea7317"/></marker>
<marker id="c2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#78716c"/></marker>
</defs>
</svg>
